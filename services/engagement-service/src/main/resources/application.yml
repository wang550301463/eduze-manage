server:
  port: ${SERVER_PORT:8087}
spring:
  application:
    name: engagement-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/eduze_engagement?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true}
    username: ${DB_USER:eduze_engagement}
    password: ${DB_PASSWORD:}
  flyway:
    locations: classpath:db/runtime,classpath:db/migration
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
eduze:
  runtime:
    service-name: engagement
    service-token: ${SERVICE_TOKEN:}
    services:
      identity: ${IDENTITY_URL:http://identity-service:8081}
      academic: ${ACADEMIC_URL:http://academic-service:8082}
      teaching: ${TEACHING_URL:http://teaching-service:8083}
      portfolio: ${PORTFOLIO_URL:http://portfolio-service:8084}
      media: ${MEDIA_URL:http://media-service:8085}
      notification: ${NOTIFICATION_URL:http://notification-service:8086}
    callers:
      identity: ${IDENTITY_TOKEN:}
      academic: ${ACADEMIC_TOKEN:}
      teaching: ${TEACHING_TOKEN:}
      portfolio: ${PORTFOLIO_TOKEN:}
      media: ${MEDIA_TOKEN:}
      notification: ${NOTIFICATION_TOKEN:}


springdoc:
  api-docs:
    path: /internal/openapi
  paths-to-match: /api/**

services:
  mysql:
    image: mysql:8.0.36
    container_name: eduze-mysql
    restart: unless-stopped
    mem_limit: 1g
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-eduze}
      MYSQL_USER: ${DB_USER:-eduze}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ../backups:/backups
    # 生产仅 compose 内网可达，不映射宿主机端口；排查可用 docker compose exec
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: eduze-redis
    restart: unless-stopped
    mem_limit: 256m
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    # 生产仅 compose 内网可达，不映射宿主机端口
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    image: eduze-manage:${APP_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: eduze-app
    restart: unless-stopped
    mem_limit: 768m
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-eduze}
      DB_USER: ${DB_USER:-eduze}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      EDUZE_STORAGE_LOCAL_ROOT: /data/storage
    volumes:
      - ../storage:/data/storage
      - ../logs:/app/logs
      - ../backups:/backups
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  nginx:
    image: nginx:1.27-alpine
    container_name: eduze-nginx
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro

volumes:
  mysql_data:
  redis_data:

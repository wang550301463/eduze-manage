events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  resolver 127.0.0.11 valid=5s ipv6=off;
  upstream identity_upstream { zone identity_upstream 64k; server identity:8080 resolve; }
  upstream academic_upstream { zone academic_upstream 64k; server academic:8080 resolve; }
  upstream teaching_upstream { zone teaching_upstream 64k; server teaching:8080 resolve; }
  upstream portfolio_upstream { zone portfolio_upstream 64k; server portfolio:8080 resolve; }
  upstream media_upstream { zone media_upstream 64k; server media:8080 resolve; }
  upstream notification_upstream { zone notification_upstream 64k; server notification:8080 resolve; }
  upstream engagement_upstream { zone engagement_upstream 64k; server engagement:8080 resolve; }
  upstream commerce_upstream { zone commerce_upstream 64k; server commerce:8080 resolve; }
  upstream web_upstream { zone web_upstream 64k; server web:8080 resolve; }

  log_format safe '$remote_addr $request_method $uri $status $request_time';
  access_log /var/log/nginx/access.log safe;
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=enquiry:10m rate=5r/m;
  client_max_body_size 200m;
  server {
    listen 8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Service-Name "";
    proxy_set_header X-Service-Token "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    add_header X-Content-Type-Options nosniff always;
    location /internal { return 404; }
    location /actuator { return 404; }
    location = /api/teachers { proxy_pass http://identity_upstream; }
    location = /api/auth/login { limit_req zone=login burst=5 nodelay; proxy_pass http://identity_upstream; }
    location ~ ^/api/(auth|me|users|roles|permissions|branches)(/|$) { proxy_pass http://identity_upstream; }
    location /api/v1/identity/ { proxy_pass http://identity_upstream; }
    location /api/v1/teaching/ { proxy_pass http://teaching_upstream; }
    location /api/curriculum/ { proxy_pass http://teaching_upstream; }
    location ~ ^/api/students/[^/]+/stage-assessments { proxy_pass http://portfolio_upstream; }
    location /api/v1/portfolio/ { proxy_pass http://portfolio_upstream; }
    location /api/v1/media/ { proxy_pass http://media_upstream; }
    location ~ ^/api/v1/engagement/public/studios/[^/]+/enquiries$ { limit_req zone=enquiry burst=3 nodelay; proxy_pass http://engagement_upstream; }
    location /api/v1/engagement/ { proxy_pass http://engagement_upstream; }
    location /api/v1/commerce/ { proxy_pass http://commerce_upstream; }
    location /api/v1/notifications { proxy_pass http://notification_upstream; }
    location /api/ { proxy_pass http://academic_upstream; }
    location / { proxy_pass http://web_upstream; }
  }
}

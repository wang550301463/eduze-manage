name: eduze-platform
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    mem_limit: 1g
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?required}
      ACADEMIC_DB_PASSWORD: ${ACADEMIC_DB_PASSWORD:?required}
      TEACHING_DB_PASSWORD: ${TEACHING_DB_PASSWORD:?required}
      PORTFOLIO_DB_PASSWORD: ${PORTFOLIO_DB_PASSWORD:?required}
      MEDIA_DB_PASSWORD: ${MEDIA_DB_PASSWORD:?required}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?required}
      ENGAGEMENT_DB_PASSWORD: ${ENGAGEMENT_DB_PASSWORD:?required}
      COMMERCE_DB_PASSWORD: ${COMMERCE_DB_PASSWORD:?required}
    volumes:
    - platform_mysql:/var/lib/mysql
    - ./mysql-init.sh:/docker-entrypoint-initdb.d/01-services.sh:ro
    healthcheck:
      test:
      - CMD-SHELL
      - MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysqladmin ping -h localhost -uroot --silent
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    mem_limit: 256m
    environment:
      IDENTITY_REDIS_PASSWORD: ${IDENTITY_REDIS_PASSWORD:?required}
      ACADEMIC_REDIS_PASSWORD: ${ACADEMIC_REDIS_PASSWORD:?required}
    volumes:
    - platform_redis:/data
    - ./redis-start.sh:/usr/local/bin/service-redis.sh:ro
    entrypoint:
    - sh
    - /usr/local/bin/service-redis.sh
    healthcheck:
      test:
      - CMD-SHELL
      - REDISCLI_AUTH="$IDENTITY_REDIS_PASSWORD" redis-cli --user identity ping
      interval: 5s
      timeout: 3s
      retries: 20
  identity:
    image: eduze-identity:${IDENTITY_IMAGE_TAG:-${PLATFORM_VERSION:-local}}
    build:
      context: ../..
      dockerfile: docker/platform/Service.Dockerfile
      args:
        SERVICE: identity-service
    restart: unless-stopped
    mem_limit: 640m
    environment:
      SERVER_PORT: '8080'
      SPRING_PROFILES_ACTIVE: ${PLATFORM_PROFILE:-dev}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/eduze_identity?connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: eduze_identity
      SPRING_DATASOURCE_PASSWORD: ${IDENTITY_DB_PASSWORD:?required}
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?required}
      SERVICE_TOKEN: ${IDENTITY_SERVICE_TOKEN:?required}
      EDUZE_RUNTIME_SERVICE_NAME: identity
      EDUZE_RUNTIME_SERVICE_TOKEN: ${IDENTITY_SERVICE_TOKEN:?required}
      SPRING_FLYWAY_LOCATIONS: classpath:db/runtime,classpath:db/migration
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai -XX:MaxRAMPercentage=65.0 -XX:+ExitOnOutOfMemoryError
      EDUZE_RUNTIME_SERVICES_IDENTITY: http://identity:8080
      EDUZE_RUNTIME_CALLERS_IDENTITY: ${IDENTITY_SERVICE_TOKEN:?required}
      IDENTITY_SERVICE_TOKEN: ${IDENTITY_SERVICE_TOKEN:?required}
      EDUZE_RUNTIME_SERVICES_ACADEMIC: http://academic:8080
      EDUZE_RUNTIME_CALLERS_ACADEMIC: ${ACADEMIC_SERVICE_TOKEN:?required}
      ACADEMIC_SERVICE_TOKEN: ${ACADEMIC_SERVICE_TOKEN:?required}
      EDUZE_RUNTIME_SERVICES_TEACHING: http://teaching:8080
      EDUZE_RUNTIME_CALLERS_TEACHING: ${TEACHING_SERVICE_TOKEN:?required}
      TEACHING_SERVICE_TOKEN: ${TEACHING_SERVICE_TOKEN:?required}
      EDUZE_RUNTIME_SERVICES_PORTFOLIO: http://portfolio:8080
      EDUZE_RUNTIME_CALLERS_PORTFOLIO: ${PORTFOLIO_SERVICE_TOKEN:?required}
      PORTFOLIO_SERVICE_TOKEN: ${PORTFOLIO_SERVICE_TOKEN:?required}
      EDUZE_RUNTIME_SERVICES_MEDIA: http://media:8080
      EDUZE_RUNTIME_CALLERS_MEDIA: ${MEDIA_SERVICE_TOKEN:?required}
      MEDIA_SERVICE_TOKEN: ${MEDIA_SERVICE_TOKEN:?required}
      EDUZE_RUNTIME_SERVICES_NOTIFICATION: http://notification:8080
      EDUZE_RUNTIME_CALLERS_NOTIFICATION: ${NOTIFICATION_SERVICE_TOKEN:?required}
      NOTIFICATION_SERVICE_TOKEN: ${NOTIFICATION_SERVICE_TOKEN:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_USERNAME: identity
      SPRING_DATA_REDIS_PASSWORD: ${IDENTITY_REDIS_PASSWORD:?required}
      IDENTITY_REDIS_PASSWORD: ${IDENTITY_REDIS_PASSWORD:?required}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?required}
      REDIS_PASSWORD: ${IDENTITY_REDIS_PASSWORD:?required}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:?required}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?required}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_SECRET: ${WECHAT_APP_SECRET:-}
      EDUZE_RUNTIME_SERVICES_ENGAGEMENT: http://engagement:8080
      EDUZE_RUNTIME_CALLERS_ENGAGEMENT: ${ENGAGEMENT_SERVICE_TOKEN:?required}
      ENGAGEMENT_SERVICE_TOKEN: ${ENGAGEMENT_SERVICE_TOKEN:?required}
      EDUZE_RUNTIME_SERVICES_COMMERCE: http://commerce:8080
      EDUZE_RUNTIME_CALLERS_COMMERCE: ${COMMERCE_SERVICE_TOKEN:?required}
      COMMERCE_SERVICE_TOKEN: ${COMMERCE_SERVICE_TOKEN:?required}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8080/actuator/health
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

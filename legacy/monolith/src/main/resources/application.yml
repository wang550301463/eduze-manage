server:
  port: 8080

spring:
  application:
    name: eduze-manage
  profiles:
    active: dev
  web:
    resources:
      add-mappings: false
  flyway:
    placeholders:
      demoSeed: "false"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

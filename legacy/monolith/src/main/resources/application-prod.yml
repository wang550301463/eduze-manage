spring:
  application:
    name: eduze-manage
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:eduze}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: false
    out-of-order: false
    locations: classpath:db/migration
    validate-on-migrate: true
    table: flyway_schema_history
    placeholders:
      demoSeed: "false"
  data:
    redis:
      client-type: lettuce
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DB:0}
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

eduze:
  tenant:
    default-id: 1
  jwt:
    secret: ${JWT_SECRET}
    access-ttl-min: 15
    refresh-ttl-day: 7
  storage:
    local-root: ${EDUZE_STORAGE_LOCAL_ROOT:./storage}
  bootstrap:
    admin-username: ${BOOTSTRAP_ADMIN_USERNAME:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
